<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Leitor de Códigos de Barras</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
  body { font-family: sans-serif; margin: 0; padding: 20px; }
  #btn-scan-codigo { padding: 10px 20px; font-size: 16px; }

  #camera-popup {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background-color: rgba(0,0,0,0.9);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  #camera {
    width: 100%;
    max-width: 500px;
    height: 400px;
    background: #000;
    position: relative;
  }

  #camera-select {
    margin-bottom: 10px;
    font-size: 16px;
    padding: 5px;
    z-index: 10001;
  }

  #btn-close-camera {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: #ff5555;
    color: white;
    border: none;
    padding: 10px;
    font-size: 14px;
    border-radius: 5px;
    cursor: pointer;
    z-index: 10001;
  }
</style>

</head>
<body>

  <button id="btn-scan-codigo">📷 Ler código de barras</button>

  <!-- Popup da câmera -->
  <div id="camera-popup" style="display: none; flex;">
    <select id="camera-select"></select>
    <div id="camera"></div>
    <button id="btn-close-camera">Fechar</button>
  </div>

  <script>
    let quaggaStarted = false;

    // Listar câmeras disponíveis
    function listarCameras() {
      const select = document.getElementById('camera-select');
      navigator.mediaDevices.enumerateDevices().then(devices => {
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        select.innerHTML = ''; // Limpar opções anteriores
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Câmera ${index + 1}`;
          select.appendChild(option);
        });
      }).catch(err => {
        console.error('Erro ao listar câmeras:', err);
      });
    }

    // Iniciar leitura
    document.getElementById('btn-scan-codigo').addEventListener('click', () => {
      const popup = document.getElementById('camera-popup');
      popup.style.display = 'flex';
      listarCameras();

      // Espera um pouco para o select popular
      setTimeout(() => iniciarQuagga(), 500);
    });

    // Trocar câmera e reiniciar leitura
    document.getElementById('camera-select').addEventListener('change', () => {
      if (quaggaStarted) {
        Quagga.stop();
        quaggaStarted = false;
      }
      iniciarQuagga();
    });

    // Fechar popup
    document.getElementById('btn-close-camera').addEventListener('click', () => {
      stopCamera();
    });

    function iniciarQuagga() {
      const selectedDeviceId = document.getElementById('camera-select').value;

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#camera'),
          constraints: {
            deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined
          }
        },
        decoder: {
          readers: ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader"]
        }
      }, function (err) {
        if (err) {
          console.error("Erro ao iniciar Quagga:", err);
          return;
        }
        Quagga.start();
        quaggaStarted = true;
      });

      Quagga.onDetected(function (result) {
        const code = result.codeResult.code;
        alert("Código detectado: " + code);
        stopCamera();
      });
    }

    function stopCamera() {
      const popup = document.getElementById('camera-popup');
      popup.style.display = 'none';
      if (quaggaStarted) {
        Quagga.stop();
        quaggaStarted = false;
      }
    }
  </script>

</body>
</html>
