<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Leitor de Códigos de Barras</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
  body { font-family: sans-serif; margin: 0; padding: 20px; }
  #btn-scan-codigo { padding: 10px 20px; font-size: 16px; }

  #camera-popup {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background-color: rgba(0,0,0,0.9);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  #camera {
    width: 100%;
    max-width: 500px;
    height: 400px;
    background: #000;
    position: relative;
  }

  #camera-select {
    margin-bottom: 10px;
    font-size: 16px;
    padding: 5px;
    z-index: 10001;
  }

  #btn-close-camera {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: #ff5555;
    color: white;
    border: none;
    padding: 10px;
    font-size: 14px;
    border-radius: 5px;
    cursor: pointer;
    z-index: 10001;
  }
</style>

</head>
<body>

  <button id="btn-scan-codigo">📷 Ler código de barras</button>

  <!-- Popup da câmera -->
  <div id="camera-popup" style="display: none; flex;">
    <select id="camera-select"></select>
    <div id="camera"></div>
    <button id="btn-flash" style="position: absolute; top: 10px; left: 10px; background-color: #ffd700; color: black; border: none; padding: 10px; font-size: 14px; border-radius: 5px; cursor: pointer; z-index: 10001;">🔦 Flash</button>
    <button id="btn-close-camera">Fechar</button>
  </div>

  <script>
    let quaggaStarted = false;
    let track = null;
    let imageCapture = null;
    let torchOn = false;

    document.getElementById('btn-scan-codigo').addEventListener('click', () => {
      const popup = document.getElementById('camera-popup');
      popup.style.display = 'flex';

      if (!quaggaStarted) {
        Quagga.init({
          inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#camera'),
            constraints: {
              facingMode: "environment"
            }
          },
          decoder: {
            readers: ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader"]
          }
        }, async function (err) {
          if (err) {
            console.error("Erro ao iniciar Quagga:", err);
            return;
          }
          Quagga.start();
          quaggaStarted = true;

          // Pegar a stream de vídeo e configurar o controle de flash
          const stream = Quagga.cameraAccess.getActiveStream();
          if (stream) {
            track = stream.getVideoTracks()[0];
            try {
              imageCapture = new ImageCapture(track);
              const capabilities = track.getCapabilities();
              if (!capabilities.torch) {
                document.getElementById('btn-flash').style.display = 'none';
              }
            } catch (e) {
              console.warn("Torch não suportado:", e);
              document.getElementById('btn-flash').style.display = 'none';
            }
          }
        });

        Quagga.onDetected(function (result) {
          const code = result.codeResult.code;
          alert("Código detectado: " + code);
          stopCamera();
        });
      }
    });

    document.getElementById('btn-close-camera').addEventListener('click', () => {
      stopCamera();
    });

    document.getElementById('btn-flash').addEventListener('click', async () => {
      if (track) {
        try {
          await track.applyConstraints({
            advanced: [{ torch: !torchOn }]
          });
          torchOn = !torchOn;
        } catch (e) {
          console.error("Erro ao controlar o flash:", e);
        }
      }
    });

    function stopCamera() {
      const popup = document.getElementById('camera-popup');
      popup.style.display = 'none';

      if (quaggaStarted) {
        Quagga.stop();
        quaggaStarted = false;
      }

      if (track) {
        track.stop();
        track = null;
      }

      torchOn = false;
      document.getElementById('btn-flash').style.display = 'inline-block';
    }
    </script>


</body>
</html>
